# Railway config-as-code. Add a PostgreSQL service to the same project and set
# DATABASE_URL=${{Postgres.DATABASE_URL}} on this service (see README).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
