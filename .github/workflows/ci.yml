name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: leads_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check app tests
      - name: Tests (SQLite)
        run: pytest
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leads_test
        run: pytest
      - name: Migrations apply cleanly on PostgreSQL
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leads_test
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine, text
          e = create_engine("postgresql+psycopg://postgres:postgres@localhost:5432/leads_test")
          with e.begin() as c:
              c.execute(text("DROP SCHEMA public CASCADE; CREATE SCHEMA public"))
          PY
          alembic upgrade head && alembic check
