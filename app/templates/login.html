{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth">
  <img class="auth-logo" src="/static/icons/icon-192.png" alt="" width="64" height="64">
  <h1>{{ settings().company_name }} Leads</h1>
  <div class="card">
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" name="email" value="{{ email or '' }}" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%; padding:0.7rem">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
